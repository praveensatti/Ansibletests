version: "3.9"

services:
  wildfly_app:
    build:
      context: ./docker/wildfly
      args:
        WAR_URL: ${WAR_URL:-https://get.jenkins.io/war-stable/latest/jenkins.war}
        WAR_NAME: ${WAR_NAME:-jenkins.war}
    image: ansibletests/wildfly-war:latest
    container_name: wildfly-app
    environment:
      APP_LOGS_ROOT_DIR: ${APP_LOGS_ROOT_DIR:-/opt/jboss/wildfly/custom-logs}
      APP_LOG_MODE: ${APP_LOG_MODE:-info}
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${MGMT_PORT:-9990}:9990"
    volumes:
      - ${HOST_LOG_DIR:-./runtime-logs}:${APP_LOGS_ROOT_DIR:-/opt/jboss/wildfly/custom-logs}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
